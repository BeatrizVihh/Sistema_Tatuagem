<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Dashboard — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


  <style>
    :root {
      --blush: #fcf6f7;
      --petala: #f0e1e4;
      --rosa: #d46a8d;
      --rosa-escuro: #bf5678;
      --lavanda: #fce4ec;
      --ameixa: #4a383c;
      --malva: #735d62;
    }

    body {
      background: var(--blush);
      color: #5c4a4e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }


    .navbar.bg-dark {
      background-color: #ffffff !important;
      border-bottom: 1px solid var(--petala);
      box-shadow: 0 2px 10px rgba(224, 141, 172, .1);
    }
    .navbar .navbar-brand {
      color: var(--rosa) !important;
      font-weight: 600;
      letter-spacing: .5px;
    }
    .navbar .btn-outline-light {
      color: var(--rosa);
      border: 2px solid var(--rosa);
      border-radius: 25px;
      padding: .2rem .9rem;
    }
    .navbar .btn-outline-light:hover { background: var(--rosa); color: #fff; }

    h1 { color: var(--ameixa); }

    .btn {
      border-radius: 15px;
      font-weight: 600;
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }
    .btn-primary,
    .btn-secondary {
      box-shadow: 0 4px 15px rgba(224, 141, 172, .12);
    }
    .btn-primary:hover,
    .btn-secondary:hover {
      transform: translateY(-3px);
    }

    .btn-primary {
      background-color: var(--rosa);
      border-color: var(--rosa);
      color: #fff;
    }
    .btn-primary:hover, .btn-primary:focus {
      background-color: var(--rosa-escuro);
      border-color: var(--rosa-escuro);
      color: #fff;
    }

    .btn-secondary {
      background-color: #fff;
      border: 1px solid var(--petala);
      color: var(--rosa-escuro);
    }
    .btn-secondary:hover, .btn-secondary:focus {
      background-color: var(--lavanda);
      border-color: var(--rosa);
      color: var(--rosa-escuro);
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn-primary:hover, .btn-secondary:hover { transform: none; }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Estúdio de Tatuagem</span>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </nav>

  <div class="container">
    <h1 class="mb-4">Painel</h1>
    <div class="row g-3">
      <div class="col-md-4">
        <a href="clientes.html" class="btn btn-primary w-100 py-3">Clientes</a>
      </div>
      <div class="col-md-4">
        <a href="tatuadores.html" class="btn btn-primary w-100 py-3">Tatuadores</a>
      </div>
      <div class="col-md-4">
        <a href="agendamentos.html" class="btn btn-primary w-100 py-3">Agendamentos</a>
      </div>
      <div class="col-md-4">
        <a href="senioridade.html" class="btn btn-secondary w-100 py-3">Senioridade</a>
      </div>
      <div class="col-md-4">
        <a href="estilos.html" class="btn btn-secondary w-100 py-3">Estilos</a>
      </div>
      <div class="col-md-4">
        <a href="cadastro.html" class="btn btn-secondary w-100 py-3">Novo Funcionário</a>
      </div>
    </div>
  </div>

  <script src="js/auth.js"></script>
  <script>
    protegerPagina()   // o dashboard também é protegido — sem login, não entra
  </script>

</body>
</html>
