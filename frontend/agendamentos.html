<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Agendamentos — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Apenas cores e organização visual; o HTML abaixo é o original -->
  <style>
    :root {
      --blush: #fcf6f7;
      --petala: #f0e1e4;
      --rosa: #d46a8d;
      --rosa-escuro: #bf5678;
      --lavanda: #fce4ec;
      --ameixa: #4a383c;
      --malva: #735d62;
    }

    body {
      background: var(--blush);
      color: #5c4a4e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Menu branco com marca rosa, igual à página inicial */
    .navbar.bg-dark {
      background-color: #ffffff !important;
      border-bottom: 1px solid var(--petala);
      box-shadow: 0 2px 10px rgba(224, 141, 172, .1);
      border-radius: 12px;
    }
    .navbar .navbar-brand {
      color: var(--rosa) !important;
      font-weight: 600;
      letter-spacing: .5px;
    }
    .navbar a.text-light {
      color: var(--malva) !important;
      text-decoration: none;
      font-weight: 600;
    }
    .navbar a.text-light:hover { color: var(--rosa) !important; }
    .navbar .btn-outline-light {
      color: var(--rosa);
      border: 2px solid var(--rosa);
      border-radius: 25px;
      padding: .2rem .9rem;
    }
    .navbar .btn-outline-light:hover { background: var(--rosa); color: #fff; }

    /* Título */
    h1 { color: var(--ameixa); margin-bottom: 1rem; }

    /* Formulário em painel branco */
    #form-agendamento {
      background: #fff;
      border: 1px solid var(--petala);
      border-radius: 15px;
      padding: 1.25rem .75rem 1.5rem;
      margin-left: 0;
      margin-right: 0;
      box-shadow: 0 4px 15px rgba(224, 141, 172, .08);
    }

    .form-control, .form-select {
      border-color: var(--petala);
      background-color: var(--blush);
      color: var(--ameixa);
    }
    .form-control::placeholder { color: #b9a1a6; }
    .form-control:focus, .form-select:focus {
      border-color: var(--rosa);
      background-color: #fff;
      box-shadow: 0 0 0 .2rem rgba(212, 106, 141, .2);
    }
    .form-label { color: var(--malva); font-weight: 600; }

    /* Botão "Escolher arquivo" do campo de imagem */
    .form-control[type="file"]::file-selector-button {
      background-color: var(--lavanda);
      color: var(--rosa-escuro);
      border-color: var(--petala);
      font-weight: 600;
    }
    .form-control[type="file"]:hover:not(:disabled):not([readonly])::file-selector-button {
      background-color: #f8d3e0;
    }

    /* Botões (inclui os criados pelo JavaScript) */
    .btn-primary {
      background-color: var(--rosa);
      border-color: var(--rosa);
      border-radius: 25px;
    }
    .btn-primary:hover, .btn-primary:focus {
      background-color: var(--rosa-escuro);
      border-color: var(--rosa-escuro);
    }
    .btn-warning {
      background-color: var(--lavanda);
      border-color: var(--lavanda);
      color: var(--ameixa);
      border-radius: 25px;
    }
    .btn-warning:hover {
      background-color: #f8d3e0;
      border-color: #f8d3e0;
      color: var(--ameixa);
    }
    .btn-danger {
      background-color: #fff;
      border: 1px solid var(--rosa);
      color: var(--rosa-escuro);
      border-radius: 25px;
    }
    .btn-danger:hover { background-color: var(--rosa); border-color: var(--rosa); color: #fff; }

    /* Tabela */
    .table {
      background: #fff;
      color: #5c4a4e;
      border-color: var(--petala);
      --bs-table-bg: #fff;
      --bs-table-border-color: var(--petala);
    }
    .table thead th {
      background: var(--lavanda);
      color: var(--rosa-escuro);
      border-bottom: 2px solid var(--rosa);
      vertical-align: middle;
    }
    .table td { vertical-align: middle; }
    .table tbody tr:hover > * { background-color: var(--blush); }
  </style>
</head>
<body class="container py-4">

  <nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">  . ݁⋆ ۶ৎ ݁˖ . ݁Estúdio de Tatuagem</span>
    <div>
      <a href="clientes.html" class="text-light me-3">Clientes</a>
      <a href="senioridade.html" class="text-light me-3">Senioridade</a>
      <a href="estilos.html" class="text-light me-3">Estilos</a>
      <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
      <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
       <a href="dashboard.html" class="text-light me-3">Dashboard</a>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </div>
</nav>

  <h1>Agendamentos</h1>

  <!-- Formulário para cadastrar novo agendamento -->
  <form id="form-agendamento" class="row g-2 mt-2 mb-4">
    <div class="col-md-3">
      <select id="idcliente" class="form-select" required>
        <option value="">Cliente...</option>
      </select>
    </div>
    <div class="col-md-3">
      <select id="idtatuador" class="form-select" required>
        <option value="">Tatuador...</option>
      </select>
    </div>
    <div class="col-md-2">
      <input type="date" id="dataagendamento" class="form-control" required>
    </div>
    <div class="col-md-2">
      <input type="time" id="horaagendamento" class="form-control" required>
    </div>
    <div class="col-md-2">
      <input type="number" id="valortatuagem" class="form-control" placeholder="Valor (R$)" step="0.01" min="0">
    </div>
    <div class="col-md-12">
      <textarea id="descricaotatuagem" class="form-control" placeholder="Descrição da tatuagem"></textarea>
    </div>
    <div class="col-md-4">
  <label class="form-label">Desenho aprovado (imagem)</label>
  <input type="file" id="desenho" class="form-control" accept="image/*">
</div>

    <!-- Esse bloco começa escondido — só aparece quando estamos editando um agendamento existente -->
    <div class="col-md-3" id="bloco-status" style="display: none;">
      <select id="status" class="form-select">
        <option value="pendente">Pendente</option>
        <option value="confirmado">Confirmado</option>
        <option value="concluido">Concluído</option>
        <option value="cancelado">Cancelado</option>
      </select>
    </div>

    <div class="col-md-2">
      <button id="btn-submit-agendamento" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <!-- Tabela onde os agendamentos vão aparecer -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Cliente</th>
        <th>Tatuador</th>
        <th>Data</th>
        <th>Hora</th>
        <th>Valor</th>
        <th>Status</th>
        <th>Desenho</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- os agendamentos vão aparecer aqui -->
    </tbody>
  </table>
  <script src="js/auth.js"></script>
  <script src="js/agendamentos.js"></script>

</body>
</html>
