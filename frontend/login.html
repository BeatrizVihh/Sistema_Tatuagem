<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Login — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Apenas cores e organização visual; o HTML abaixo é o original -->
  <style>
    :root {
      --blush: #fff0f5;
      --petala: #fde0ea;
      --rosa: #d9487d;
      --rosa-escuro: #b8336a;
      --lavanda: #ece2f7;
      --ameixa: #4a2142;
      --malva: #8a5a7e;
    }

    body {
      background: var(--blush);
      color: var(--ameixa);
    }

    /* Título */
    h1 { color: var(--rosa-escuro); text-align: center; }

    /* Formulário organizado em um painel */
    #form-login {
      background: #fff;
      border: 1px solid var(--petala);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 14px rgba(138, 90, 126, .1);
    }
    .form-control {
      border-color: var(--petala);
      background-color: var(--blush);
      color: var(--ameixa);
    }
    .form-control::placeholder { color: #b58aa6; }
    .form-control:focus {
      border-color: var(--rosa);
      background-color: #fff;
      box-shadow: 0 0 0 .2rem rgba(217, 72, 125, .2);
    }

    /* Botão */
    .btn-primary { background-color: var(--rosa); border-color: var(--rosa); }
    .btn-primary:hover, .btn-primary:focus {
      background-color: var(--rosa-escuro);
      border-color: var(--rosa-escuro);
    }

    /* Link */
    a { color: var(--rosa); font-weight: 600; }
    a:hover { color: var(--rosa-escuro); }
  </style>
</head>
<body class="container py-5" style="max-width: 480px;">

  <h1 class="mb-4">.✦ ݁˖Entrar.✦ ݁˖</h1>

  <form id="form-login">
    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="E-mail" required>
    </div>
    <div class="mb-3">
      <input type="password" id="senha" class="form-control" placeholder="Senha" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Entrar</button>
  </form>

  <p class="mt-3 text-center">
    Não tem conta? <a href="cadastro.html">Cadastre-se</a>
  </p>

  <script src="js/login.js"></script>

</body>
</html>
