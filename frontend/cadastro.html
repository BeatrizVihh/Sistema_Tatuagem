<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Apenas cores e organização visual; o HTML abaixo é o original -->
  <style>
    :root {
      --blush: #fcf6f7;
      --petala: #f0e1e4;
      --rosa: #d46a8d;
      --rosa-escuro: #bf5678;
      --ameixa: #4a383c;
    }

    body {
      background: var(--blush);
      color: #5c4a4e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    /* Título */
    h1 { color: var(--ameixa); text-align: center; }

    /* Formulário em painel branco */
    #form-cadastro {
      background: #fff;
      border: 1px solid var(--petala);
      border-radius: 15px;
      padding: 1.5rem;
      box-shadow: 0 4px 15px rgba(224, 141, 172, .08);
    }
    .form-control {
      border-color: var(--petala);
      background-color: var(--blush);
      color: var(--ameixa);
    }
    .form-control::placeholder { color: #b9a1a6; }
    .form-control:focus {
      border-color: var(--rosa);
      background-color: #fff;
      box-shadow: 0 0 0 .2rem rgba(212, 106, 141, .2);
    }

    /* Botão */
    .btn-primary {
      background-color: var(--rosa);
      border-color: var(--rosa);
      border-radius: 25px;
    }
    .btn-primary:hover, .btn-primary:focus {
      background-color: var(--rosa-escuro);
      border-color: var(--rosa-escuro);
    }

    /* Link */
    a { color: var(--rosa); font-weight: 600; }
    a:hover { color: var(--rosa-escuro); }
  </style>
</head>
<body class="container py-5" style="max-width: 480px;">

  <h1 class="mb-4">.✦ ݁˖Criar conta.✦ ݁˖</h1>

  <form id="form-cadastro">
    <div class="mb-3">
      <input type="text" id="nome" class="form-control" placeholder="Nome" required>
    </div>
    <div class="mb-3">
      <input type="email" id="email" class="form-control" placeholder="E-mail" required>
    </div>
    <div class="mb-3">
      <input type="password" id="senha" class="form-control" placeholder="Senha" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
  </form>

  <p class="mt-3 text-center">
    Já tem conta? <a href="login.html">Entrar</a>
  </p>
  <script src="js/auth.js"></script>
  <script src="js/cadastro.js"></script>

</body>
</html>
