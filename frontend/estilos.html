<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Estilos — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">


  <style>
    :root {
      --blush: #fcf6f7;
      --petala: #f0e1e4;
      --rosa: #d46a8d;
      --rosa-escuro: #bf5678;
      --lavanda: #fce4ec;
      --ameixa: #4a383c;
      --malva: #735d62;
    }

    body {
      background: var(--blush);
      color: #5c4a4e;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar.bg-dark {
      background-color: #ffffff !important;
      border-bottom: 1px solid var(--petala);
      box-shadow: 0 2px 10px rgba(224, 141, 172, .1);
      border-radius: 12px;
    }
    .navbar .navbar-brand {
      color: var(--rosa) !important;
      font-weight: 600;
      letter-spacing: .5px;
    }
    .navbar a.text-light {
      color: var(--malva) !important;
      text-decoration: none;
      font-weight: 600;
    }
    .navbar a.text-light:hover { color: var(--rosa) !important; }
    .navbar .btn-outline-light {
      color: var(--rosa);
      border: 2px solid var(--rosa);
      border-radius: 25px;
      padding: .2rem .9rem;
    }
    .navbar .btn-outline-light:hover { background: var(--rosa); color: #fff; }

  
    h1 { color: var(--ameixa); margin-bottom: 1rem; }


    #form-estilo {
      background: #fff;
      border: 1px solid var(--petala);
      border-radius: 15px;
      padding: 1.25rem .75rem 1.5rem;
      margin-left: 0;
      margin-right: 0;
      box-shadow: 0 4px 15px rgba(224, 141, 172, .08);
    }

    .form-control, .form-select {
      border-color: var(--petala);
      background-color: var(--blush);
      color: var(--ameixa);
    }
    .form-control::placeholder { color: #b9a1a6; }
    .form-control:focus, .form-select:focus {
      border-color: var(--rosa);
      background-color: #fff;
      box-shadow: 0 0 0 .2rem rgba(212, 106, 141, .2);
    }
    .form-label { color: var(--malva); font-weight: 600; }

    /* Botões (inclui os criados pelo JavaScript) */
    .btn-primary {
      background-color: var(--rosa);
      border-color: var(--rosa);
      border-radius: 25px;
    }
    .btn-primary:hover, .btn-primary:focus {
      background-color: var(--rosa-escuro);
      border-color: var(--rosa-escuro);
    }
    .btn-warning {
      background-color: var(--lavanda);
      border-color: var(--lavanda);
      color: var(--ameixa);
      border-radius: 25px;
    }
    .btn-warning:hover {
      background-color: #f8d3e0;
      border-color: #f8d3e0;
      color: var(--ameixa);
    }
    .btn-danger {
      background-color: #fff;
      border: 1px solid var(--rosa);
      color: var(--rosa-escuro);
      border-radius: 25px;
    }
    .btn-danger:hover { background-color: var(--rosa); border-color: var(--rosa); color: #fff; }

   
    .table {
      background: #fff;
      color: #5c4a4e;
      border-color: var(--petala);
      --bs-table-bg: #fff;
      --bs-table-border-color: var(--petala);
    }
    .table thead th {
      background: var(--lavanda);
      color: var(--rosa-escuro);
      border-bottom: 2px solid var(--rosa);
      vertical-align: middle;
    }
    .table td { vertical-align: middle; }
    .table tbody tr:hover > * { background-color: var(--blush); }
  </style>
</head>
<body class="container py-4">

  <nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand">Estúdio de Tatuagem</span>
    <div>
      <a href="clientes.html" class="text-light me-3">Clientes</a>
      <a href="senioridade.html" class="text-light me-3">Senioridade</a>
      <a href="estilos.html" class="text-light me-3">Estilos</a>
      <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
      <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </div>
</nav>

  <h1>Estilos</h1>

  <form id="form-estilo" class="row g-2 mt-2 mb-4">
    <div class="col-md-4">
      <input type="text" id="descricao" class="form-control" placeholder="Descrição (ex: Blackwork)" required>
    </div>
    <div class="col-md-2">
      <button id="btn-submit-estilo" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
  </form>

  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Descrição</th>
        <th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
    </tbody>
  </table>
  <script src="js/auth.js"></script>
  <script src="js/estilos.js"></script>

</body>
</html>
