<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Tatuadores — Estúdio de Tatuagem</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Apenas cores e organização visual; o HTML abaixo é o original -->
  <style>
    :root {
      --blush: #fff0f5;
      --petala: #fde0ea;
      --rosa: #d9487d;
      --rosa-escuro: #b8336a;
      --lavanda: #ece2f7;
      --ameixa: #4a2142;
      --malva: #8a5a7e;
    }

    body {
      background: var(--blush);
      color: var(--ameixa);
    }

    /* Menu */
    .navbar.bg-dark {
      background: linear-gradient(90deg, #e5629a, var(--rosa-escuro)) !important;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(217, 72, 125, .25);
    }
    .navbar a.text-light {
      color: #fff !important;
      text-decoration: none;
      opacity: .92;
    }
    .navbar a.text-light:hover { opacity: 1; text-decoration: underline; }
    .navbar .btn-outline-light:hover { background: #fff; color: var(--rosa-escuro); }

    /* Título */
    h1 { color: var(--rosa-escuro); margin-bottom: 1rem; }

    /* Formulário organizado em um painel */
    #form-tatuador {
      background: #fff;
      border: 1px solid var(--petala);
      border-radius: 12px;
      padding: 1.25rem .75rem 1.5rem;
      margin-left: 0;
      margin-right: 0;
      box-shadow: 0 4px 14px rgba(138, 90, 126, .1);
    }
    .form-control, .form-select {
      border-color: var(--petala);
      background-color: var(--blush);
      color: var(--ameixa);
    }
    .form-control::placeholder { color: #b58aa6; }
    .form-control:focus, .form-select:focus {
      border-color: var(--rosa);
      background-color: #fff;
      box-shadow: 0 0 0 .2rem rgba(217, 72, 125, .2);
    }
    .form-label { color: var(--malva); font-weight: 600; }

    .form-check-input { border-color: var(--rosa); }
    .form-check-input:checked { background-color: var(--rosa); border-color: var(--rosa); }
    .form-check-input:focus {
      border-color: var(--rosa);
      box-shadow: 0 0 0 .2rem rgba(217, 72, 125, .2);
    }

    /* Botões (inclui os criados pelo JavaScript) */
    .btn-primary { background-color: var(--rosa); border-color: var(--rosa); }
    .btn-primary:hover, .btn-primary:focus {
      background-color: var(--rosa-escuro);
      border-color: var(--rosa-escuro);
    }
    .btn-warning { background-color: var(--lavanda); border-color: var(--lavanda); color: var(--ameixa); }
    .btn-warning:hover { background-color: #dccaf0; border-color: #dccaf0; color: var(--ameixa); }
    .btn-danger { background-color: #fff; border-color: var(--rosa); color: var(--rosa-escuro); }
    .btn-danger:hover { background-color: var(--rosa); border-color: var(--rosa); color: #fff; }

    /* Tabela */
    .table {
      background: #fff;
      color: var(--ameixa);
      border-color: var(--petala);
      --bs-table-bg: #fff;
      --bs-table-border-color: var(--petala);
    }
    .table thead th {
      background: var(--petala);
      color: var(--rosa-escuro);
      border-bottom: 2px solid var(--rosa);
      vertical-align: middle;
    }
    .table td { vertical-align: middle; }
    .table tbody tr:hover > * { background-color: var(--blush); }
  </style>
</head>
<body class="container py-4">
<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <span class="navbar-brand"> . ݁⋆ ۶ৎ ݁˖ . ݁ Estúdio de Tatuagem</span>
    <div>
      <a href="clientes.html" class="text-light me-3">Clientes</a>
      <a href="senioridade.html" class="text-light me-3">Senioridade</a>
      <a href="estilos.html" class="text-light me-3">Estilos</a>
      <a href="tatuadores.html" class="text-light me-3">Tatuadores</a>
      <a href="agendamentos.html" class="text-light me-3">Agendamentos</a>
       <a href="dashboard.html" class="text-light me-3">Dashboard</a>
      <button onclick="sair()" class="btn btn-outline-light btn-sm">Sair</button>
    </div>
  </div>
</nav>
  <h1>Tatuadores</h1>

  <!-- Formulário para cadastrar novo tatuador -->
  <form id="form-tatuador" class="row g-2 mt-2 mb-4">
    <div class="col-md-3">
      <input type="text" id="nometatuador" class="form-control" placeholder="Nome" required>
    </div>
    <div class="col-md-2">
      <input type="text" id="cpf" class="form-control" placeholder="CPF (só números)" required>
    </div>
    <div class="col-md-3">
      <input type="email" id="email" class="form-control" placeholder="E-mail">
    </div>
    <div class="col-md-2">
      <input type="text" id="telefone" class="form-control" placeholder="Telefone">
    </div>
    <div class="col-md-2">
      <select id="idsenioridade" class="form-select" required>
        <option value="">Senioridade...</option>
        <!-- as opções são preenchidas pelo JavaScript -->
      </select>
    </div>
    <div class="col-md-2">
      <button id="btn-submit-tatuador" type="submit" class="btn btn-primary w-100">Cadastrar</button>
    </div>
    <div class="col-md-12">
  <label class="form-label">Estilos que domina</label>
  <div id="lista-estilos" class="d-flex flex-wrap gap-3">
    <!-- os checkboxes são preenchidos pelo JavaScript -->
  </div>
</div>
  </form>

  <!-- Tabela onde os tatuadores vão aparecer -->
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>CPF</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Senioridade</th>
        <th>Ações</th>
        <th>Estilos</th>
      </tr>
    </thead>
    <tbody id="corpo-tabela">
      <!-- os tatuadores vão aparecer aqui -->
    </tbody>
  </table>
  <script src="js/auth.js"></script>
  <script src="js/tatuadores.js"></script>

</body>
</html>
